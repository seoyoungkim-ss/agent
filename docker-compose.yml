# PRD 9.4: 사내망 Linux 서버에서 `docker compose up -d` 한 번으로 웹 대시보드를
# 구동한다. 데이터 수집 도구(ingestion-tool)는 여기 포함되지 않는다 — 운영자
# Windows PC에 별도 배포된다(PRD 9.2, ingestion-tool/README.md 참조).
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cafeteria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cafeteria}
      POSTGRES_DB: ${POSTGRES_DB:-cafeteria}
    volumes:
      - cafeteria_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cafeteria}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cafeteria}:${POSTGRES_PASSWORD:-cafeteria}@db:5432/${POSTGRES_DB:-cafeteria}
      INGEST_API_TOKEN: ${INGEST_API_TOKEN:?INGEST_API_TOKEN을 .env에 설정하세요}
      INTERNAL_LLM_BASE_URL: ${INTERNAL_LLM_BASE_URL:-}
      INTERNAL_LLM_API_KEY: ${INTERNAL_LLM_API_KEY:-}
      KMA_WEATHER_BASE_URL: ${KMA_WEATHER_BASE_URL:-https://apis.data.go.kr/1360000/AsosDalyInfoService}
      KMA_WEATHER_API_KEY: ${KMA_WEATHER_API_KEY:-}
      KMA_WEATHER_STATION_ID: ${KMA_WEATHER_STATION_ID:-119}
      # 사내 프록시가 TLS를 가로채는 경우("unable to get local issuer certificate")
      # 아래 volumes로 사내 루트 인증서를 컨테이너에 넣고 이 경로를 가리키게 한다.
      KMA_WEATHER_CA_BUNDLE: ${KMA_WEATHER_CA_BUNDLE:-}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-[]}
    ports:
      - "${APP_PORT:-8000}:8000"
    # KMA_WEATHER_CA_BUNDLE을 쓰려면 .env에 KMA_WEATHER_CA_BUNDLE_HOST_PATH(호스트의
    # 사내 루트 인증서 PEM 경로)도 채우고 아래 줄의 주석을 해제하세요. 안 쓰면
    # /dev/null이 매핑되므로(무해) 그대로 둬도 됩니다.
    # volumes:
    #   - ${KMA_WEATHER_CA_BUNDLE_HOST_PATH:-/dev/null}:/etc/ssl/certs/kma-weather-ca.pem:ro

volumes:
  cafeteria_db_data:
